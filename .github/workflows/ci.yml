name: CI

# No test/build pipeline existed before this — the only other workflow in this
# repo was the hourly-monitor cron trigger, since removed. It enforces the
# AGENTS.md gate on every push and PR, not just something a human has to
# remember to run locally. secmax's negative-test suite (SSRF, auth,
# paywall, webhook-forgery, etc.) runs here as part of `npm test`.
on:
  push:
    branches: [main]
    # Docs, skills and Markdown ship nothing (the same rule as vercel.json's
    # ignoreCommand); a push that also changes code still runs.
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "**/*.md"

# A newer push on the same branch contains the older one; its run replaces it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      # The build evaluates every route module while collecting page data, so
      # anything reading env at module scope needs a value here. These are
      # deliberately fake and deliberately inline: CI must not need repository
      # secrets to prove the code compiles, and a real key in a build log is a
      # leaked key. Nothing in this job talks to a real service.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          STRIPE_PRICE_ID: price_ci
          RESEND_API_KEY: re_ci
          RESEND_FROM_EMAIL: ci@example.com
          NEXT_PUBLIC_APP_URL: https://ci.example.com
          ENCRYPTION_KEY: ci-encryption-key-that-is-long-enough-32
          CRON_SECRET: ci-cron-secret
